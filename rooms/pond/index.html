<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pond & Pet Sanctuary — Cathy's Neighborhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/room-shell.css">
<style>
body { background: none; background-color:#1b5e20; }
#stage-overlay { position:fixed;inset:0;z-index:0;background:rgba(0,0,0,0.25);pointer-events:none; }
#room-hud,#greeting,#toybox-bar-wrap,#celebrate { z-index:10; }
#stage { z-index:1; position:relative; overflow:hidden; width:100%; }

/* ── FULL SCENE STAGE ── */
.scene {
  position:relative;
  width:100%; height:calc(100vh - 130px);
  overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
}

/* ── POND ── */
.pond-zone {
  position:absolute;
  left:50%; top:32%;
  transform:translateX(-50%);
  width:clamp(200px,52vw,320px);
  cursor:pointer;
  z-index:3;
}
.pond-body {
  width:100%;
  padding-bottom:55%;
  border-radius:50%;
  background:radial-gradient(ellipse at 38% 35%, #64b5f6 0%, #1e88e5 50%, #1565c0 100%);
  position:relative;
  box-shadow:0 8px 32px rgba(21,101,192,.55),inset 0 -6px 18px rgba(0,0,0,.2),inset 0 4px 10px rgba(255,255,255,.12);
  overflow:hidden;
  transition:transform .15s;
}
.pond-body:active { transform:scale(.97); }
.pond-shimmer {
  position:absolute; inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
  background-size:200% 200%;
  animation:shimMove 3s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes shimMove { from{background-position:0% 0%} to{background-position:100% 100%} }

/* Lily pads */
.lily { position:absolute; border-radius:50% 50% 50% 0; background:#2e7d32; border:1.5px solid #1b5e20; }
.lily-flower { position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:.9rem; animation:floatY 2s ease-in-out infinite alternate; }

/* Ripple rings */
.ripple-ring {
  position:absolute; border-radius:50%; pointer-events:none;
  border:2px solid rgba(255,255,255,.6);
}
.ripple-ring.gsap-ripple { /* styled by GSAP */ }
.ripple-ring.css-ripple  { animation:pondRipple 1.2s ease-out forwards; }
@keyframes pondRipple { from{transform:scale(0);opacity:.8} to{transform:scale(3.5);opacity:0} }

/* Ducks */
.duck {
  position:absolute; font-size:clamp(1rem,3vw,1.5rem);
  animation:duckSwim var(--d,9s) ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes duckSwim { from{transform:translate(0,0)} to{transform:translate(var(--tx,30px),var(--ty,8px)) scaleX(-1)} }
.pond-label { position:absolute; bottom:-28px; left:50%; transform:translateX(-50%); font-family:var(--font-title); font-size:.8rem; color:rgba(255,255,255,.85); white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.6); }

/* ── ANIMALS ── */
.animal {
  position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; z-index:4; transition:transform .1s;
}
.animal:active { transform:scale(.93); }
.animal-emoji {
  font-size:clamp(3rem,12vw,5.5rem);
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));
  display:block; line-height:1;
  transition:transform .15s;
}
.animal-name { font-family:var(--font-title); font-size:.72rem; color:rgba(255,255,255,.85); text-shadow:0 1px 4px rgba(0,0,0,.7); }

/* Animal state indicators */
.hunger-bar {
  width:60px; height:8px;
  background:rgba(0,0,0,.3); border-radius:4px; overflow:hidden;
  border:1px solid rgba(255,255,255,.2);
}
.hunger-fill { height:100%; border-radius:4px; transition:width .5s ease; }
.hunger-fill.full    { background:linear-gradient(90deg,#66bb6a,#00e676); }
.hunger-fill.hungry  { background:linear-gradient(90deg,#ff9800,#ffd600); }
.hunger-fill.starving{ background:linear-gradient(90deg,#f44336,#ff5722); animation:hungerPulse 1s ease-in-out infinite; }
@keyframes hungerPulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* Thought bubble - shows what animal wants */
.thought-bubble {
  position:absolute; top:-50px; left:50%; transform:translateX(-50%);
  background:white; border-radius:50%; padding:6px 10px;
  font-size:1.4rem; box-shadow:0 4px 12px rgba(0,0,0,.3);
  animation:thoughtBob .8s ease-in-out infinite alternate;
  pointer-events:none; z-index:5; white-space:nowrap;
}
.thought-bubble::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); border:8px solid transparent; border-top-color:white; border-bottom:none; }
@keyframes thoughtBob { from{transform:translateX(-50%) translateY(0)} to{transform:translateX(-50%) translateY(-5px)} }

/* ── FOOD SHELF ── */
.food-shelf {
  position:absolute; bottom:2%; left:50%; transform:translateX(-50%);
  z-index:5;
  display:flex; gap:clamp(6px,2vw,12px); align-items:flex-end;
  background:rgba(0,0,0,.6); backdrop-filter:blur(10px);
  border-radius:20px; padding:10px 16px;
  border:1.5px solid rgba(255,255,255,.15);
  min-width:280px; justify-content:center;
}
.food-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; touch-action:manipulation;
  transition:transform .15s;
  background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.2);
  border-radius:14px; padding:8px 10px; min-width:52px;
}
.food-btn:active { transform:scale(.85) rotate(-5deg); }
.food-btn.used { opacity:.3; pointer-events:none; }
.food-emoji { font-size:clamp(1.6rem,5vw,2.2rem); }
.food-label { font-family:var(--font-title); font-size:.6rem; color:rgba(255,255,255,.8); }
.food-count { background:var(--gold); color:#1a1a1a; font-size:.55rem; font-weight:900; padding:1px 5px; border-radius:8px; font-family:var(--font-body); }

/* ── HAPPINESS BAR ── */
.happiness-bar {
  position:absolute; top:6px; left:50%; transform:translateX(-50%);
  z-index:5;
  display:flex; align-items:center; gap:8px;
  background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
  border-radius:20px; padding:6px 14px;
  border:1px solid rgba(255,255,255,.15);
  min-width:220px;
}
.hap-label { font-family:var(--font-title); font-size:.72rem; color:rgba(255,255,255,.8); white-space:nowrap; }
.hap-track { flex:1; height:10px; background:rgba(255,255,255,.15); border-radius:5px; overflow:hidden; }
.hap-fill  { height:100%; border-radius:5px; background:linear-gradient(90deg,#ff6eb4,var(--gold)); transition:width .6s cubic-bezier(.34,1.2,.64,1); }
.hap-emoji { font-size:1.1rem; }

/* ── NATURE DECOR ── */
.tree   { position:absolute; pointer-events:none; font-size:clamp(2.5rem,8vw,4rem); animation:floatY 3s ease-in-out infinite alternate; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
.flower { position:absolute; pointer-events:none; font-size:clamp(1rem,2.5vw,1.5rem); animation:floatY 2.2s ease-in-out infinite alternate; }
.cloud  { position:absolute; pointer-events:none; font-size:clamp(2rem,6vw,3.5rem); opacity:.7; animation:cloudDrift var(--d,20s) ease-in-out infinite alternate; }
@keyframes cloudDrift { from{transform:translateX(0)} to{transform:translateX(25px)} }
@keyframes floatY    { from{transform:translateY(0)} to{transform:translateY(-8px)} }

/* ── FEED ANIMATION ── */
.feed-arc {
  position:fixed; pointer-events:none; z-index:800;
  font-size:1.8rem;
  animation:feedFly var(--d,.7s) ease-out forwards;
}
@keyframes feedFly {
  0%   { transform:translate(0,0) scale(1); opacity:1; }
  50%  { transform:translate(var(--mx,0px),var(--my,-60px)) scale(1.3); opacity:1; }
  100% { transform:translate(var(--tx,0px),var(--ty,20px)) scale(.3); opacity:0; }
}

/* ── TOUCH TARGETS ── */
button,.food-btn,.animal,.pond-body { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

/* ── HIDDEN JOHNNY ── */
.johnny-hide {
  position:fixed; z-index:50;
  cursor:pointer; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  opacity:0; /* starts invisible — fades in after 8s */
  transition:opacity 1s;
  animation:none;
}
.johnny-peek {
  font-size:clamp(1.2rem,4vw,1.8rem);
  display:block;
  animation:peekBob 2s ease-in-out infinite alternate;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
@keyframes peekBob { from{transform:translateY(0) rotate(-5deg)} to{transform:translateY(-6px) rotate(5deg)} }
.johnny-pop {
  position:fixed; z-index:800;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  pointer-events:none;
}
.johnny-emoji { font-size:clamp(3rem,12vw,5rem); animation:johnnyJump .6s cubic-bezier(.34,1.5,.64,1) forwards; }
@keyframes johnnyJump { from{transform:scale(0) rotate(-20deg)} to{transform:scale(1) rotate(0)} }
.johnny-shout { font-family:var(--font-title); font-size:1rem; color:var(--gold); text-shadow:0 2px 8px rgba(0,0,0,.6); white-space:nowrap; }
</style>
</head>
<body class="has-basket">
<div id="bg-layer" style="background-image:url('bg.png')"></div>
<div id="stage-overlay"></div>
<div id="room-hud">
  <div class="hud-inner">
    <button id="back-btn" onclick="CN.Room.goBack()">← Back</button>
    <div class="hud-room-name">🐘 <span>Pond & Pets</span></div>
    <div class="hud-right">
      <button class="hud-btn" id="audioBtn" onclick="toggleAudio()">🔊</button>
      <button class="hud-btn" onclick="CN.Room.goHome()">🏠 Map</button>
    </div>
  </div>
</div>
<div id="greeting"></div>

<div id="stage">
<div class="scene" id="scene">

  <!-- CLOUDS -->
  <div class="cloud" style="left:5%;top:3%;--d:22s">☁️</div>
  <div class="cloud" style="left:60%;top:2%;--d:17s;font-size:1.8rem;opacity:.5">☁️</div>

  <!-- TREES -->
  <div class="tree" style="left:2%;bottom:28%">🌳</div>
  <div class="tree" style="right:2%;bottom:26%;animation-delay:.8s">🌲</div>
  <div class="tree" style="left:6%;bottom:18%;font-size:2rem;animation-delay:1.2s">🌿</div>

  <!-- FLOWERS -->
  <div class="flower" style="left:14%;bottom:20%">🌸</div>
  <div class="flower" style="left:20%;bottom:16%;animation-delay:.5s">🌼</div>
  <div class="flower" style="right:15%;bottom:18%;animation-delay:.3s">🌺</div>

  <!-- HAPPINESS BAR -->
  <div class="happiness-bar">
    <span class="hap-label">❤️ Happy:</span>
    <div class="hap-track"><div class="hap-fill" id="hapFill" style="width:0%"></div></div>
    <span class="hap-emoji" id="hapEmoji">😐</span>
  </div>

  <!-- POND -->
  <div class="pond-zone" id="pondZone">
    <div class="pond-body" id="pondBody" onclick="pondTap(event)">
      <div class="pond-shimmer"></div>
      <!-- Lily pads -->
      <div class="lily" style="width:22%;padding-bottom:16%;left:15%;top:55%;transform:rotate(-20deg)"><div class="lily-flower">🌸</div></div>
      <div class="lily" style="width:15%;padding-bottom:11%;left:62%;top:60%;transform:rotate(35deg)"><div class="lily-flower">🌺</div></div>
      <div class="lily" style="width:12%;padding-bottom:9%;left:40%;top:70%;transform:rotate(10deg)"><div class="lily-flower">🌼</div></div>
      <!-- Ducks & frogs -->
      <div class="duck" style="left:25%;top:18%;--d:10s;--tx:35px;--ty:8px">🦆</div>
      <div class="duck" style="left:55%;top:40%;--d:13s;--tx:-28px;--ty:-5px;font-size:.9rem">🐸</div>
    </div>
    <div class="pond-label">🌊 Tap to make ripples!</div>
  </div>

  <!-- ELLIE THE ELEPHANT -->
  <div class="animal" id="ellieZone" style="right:5%;top:20%" onclick="animalTap('ellie',event)">
    <div style="position:relative">
      <div class="thought-bubble" id="ellieBubble" style="display:none">🥜</div>
      <span class="animal-emoji" id="ellieEmoji">🐘</span>
    </div>
    <div class="animal-name">Ellie</div>
    <div class="hunger-bar"><div class="hunger-fill full" id="ellieHunger" style="width:80%"></div></div>
  </div>

  <!-- BISCUIT THE DOG -->
  <div class="animal" id="biscuitZone" style="left:5%;top:40%" onclick="animalTap('biscuit',event)">
    <div style="position:relative">
      <div class="thought-bubble" id="biscuitBubble" style="display:none">🦴</div>
      <span class="animal-emoji" id="biscuitEmoji">🐶</span>
    </div>
    <div class="animal-name">Biscuit</div>
    <div class="hunger-bar"><div class="hunger-fill full" id="biscuitHunger" style="width:80%"></div></div>
  </div>

  <!-- FOOD SHELF -->
  <div class="food-shelf" id="foodShelf">
    <!-- Populated by JS -->
  </div>

</div>
</div>

<!-- Basket Bar -->
<div id="basket-bar-wrap">
  <div class="basket-lbl">🧺</div>
  <div id="basket-bar"></div>
  <div id="coin-display">🪙 0</div>
</div>
<!-- Toybox Bar -->
<div id="toybox-bar-wrap">
  <div class="bar-row"><div class="tb-label">🧸</div><div id="toybox-bar"></div><div id="coin-display">🪙 0</div></div>
  <div class="bar-row"><div class="tb-label">🧺</div><div id="basket-bar"></div></div>
</div>

<div id="celebrate">
  <div class="celebrate-card">
    <div class="celebrate-emoji" id="celEmoji">🐘</div>
    <div class="celebrate-title" id="celTitle">They love it!</div>
    <div class="celebrate-msg"   id="celMsg">The animals are so happy!</div>
    <button class="cn-btn cn-btn-lg" style="background:linear-gradient(135deg,#2e7d32,#1b5e20)"
      onclick="hideCelebrate()">Keep Playing! 🌟</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="../../shared/cn-core.js"></script>
<script>
'use strict';
const ROOM_ID = 'pond';

/* ── ANIMAL STATE ── */
const ANIMALS = {
  ellie:   { emoji:'🐘', hunger:80, maxHunger:100, wants:['🥜','🍎','🌿','🐟'], happySound:'splash', name:'Ellie' },
  biscuit: { emoji:'🐶', hunger:80, maxHunger:100, wants:['🦴','🍪','🐟','🍖'], happySound:'collect', name:'Biscuit' },
};

/* ── FOOD DEFINITIONS ── */
const FOODS = [
  { type:'peanut', emoji:'🥜', name:'Peanuts',   target:'ellie',   count:4 },
  { type:'bone',   emoji:'🦴', name:'Dog Bone',  target:'biscuit', count:4 },
  { type:'apple',  emoji:'🍎', name:'Apple',      target:'both',    count:3 },
  { type:'fish',   emoji:'🐟', name:'Fish',       target:'both',    count:3 },
  { type:'cookie', emoji:'🍪', name:'Cookie',     target:'biscuit', count:0 }, // from kitchen toybox
];

let P = {
  happiness:   20,
  pondTaps:    0,
  lastRippleTime: 0,
  hungerTimer: null,
};

function toggleAudio(){ const m=CN.Audio.toggle(); document.getElementById('audioBtn').textContent=m?'🔇':'🔊'; }
CN.Audio.unlockOnGesture();

/* ── INIT ── */
CN.Room.init(ROOM_ID, async(saved) => {
  if(saved){
    P.happiness = saved.happiness || 20;
    if(saved.ellieHunger)   ANIMALS.ellie.hunger   = saved.ellieHunger;
    if(saved.biscuitHunger) ANIMALS.biscuit.hunger = saved.biscuitHunger;
  }
  await loadToyboxFood();
  buildFoodShelf();
  updateHungerBars();
  updateHappiness(0);
  startHungerTimer();
  CN.Audio.bgStart('pond');
  CN.Room.greet('Welcome! The animals are waiting! 🐘🐶');

  // Stagger in scene elements
  if(window.gsap){
    gsap.from('#ellieZone',   {x:60,opacity:0,duration:.7,ease:'back.out(1.4)',delay:.3});
    gsap.from('#biscuitZone', {x:-60,opacity:0,duration:.7,ease:'back.out(1.4)',delay:.5});
    gsap.from('#pondZone',    {scale:.8,opacity:0,duration:.7,ease:'back.out(1.4)',delay:.15});
    gsap.from('.food-shelf',  {y:40,opacity:0,duration:.5,ease:'back.out(1.4)',delay:.7});
  }

  // Show thought bubbles after a moment
  setTimeout(showThoughts, 2000);
});

/* ── LOAD FOOD FROM TOYBOX ── */
async function loadToyboxFood(){
  const items = await CN.Toybox.getAll();
  items.forEach(item => {
    const food = FOODS.find(f=>f.type===item.type);
    if(food) food.count += 1; // found matching food in toybox
    // Cookie from kitchen
    if(item.type==='cookie'){
      const cookie = FOODS.find(f=>f.type==='cookie');
      if(cookie) cookie.count++;
    }
  });
}

/* ── FOOD SHELF ── */
function buildFoodShelf(){
  const shelf = document.getElementById('foodShelf');
  shelf.innerHTML = '';
  let hasFood = false;
  FOODS.forEach(food => {
    if(food.count <= 0) return;
    hasFood = true;
    const btn = document.createElement('div');
    btn.className = 'food-btn';
    btn.id = 'food_'+food.type;
    btn.innerHTML = `<div class="food-emoji">${food.emoji}</div><div class="food-label">${food.name}</div><div class="food-count">${food.count}</div>`;
    btn.addEventListener('pointerdown', () => feedAnimal(food, btn));
    shelf.appendChild(btn);
  });
  if(!hasFood){
    shelf.innerHTML = '<div style="font-family:var(--font-title);font-size:.72rem;color:rgba(255,255,255,.55);text-align:center;padding:4px 8px">Cook treats in the Kitchen! 🍪<br>They\'ll appear here 🎒</div>';
  }
}

/* ── FEED ANIMAL ── */
function feedAnimal(food, btn){
  if(food.count<=0) return;
  food.count--;

  // Arc animation from food shelf to correct animal
  const bRect  = btn.getBoundingClientRect();
  const target = food.target==='ellie' ? 'ellieZone' : food.target==='biscuit' ? 'biscuitZone' : (Math.random()>.5?'ellieZone':'biscuitZone');
  const tEl    = document.getElementById(target);
  const tRect  = tEl.getBoundingClientRect();

  // Spawn flying food arc
  const arc = document.createElement('div');
  arc.className = 'feed-arc';
  arc.textContent = food.emoji;
  const mx = (bRect.left + tRect.left) / 2 - bRect.left;
  const my = Math.min(bRect.top, tRect.top) - bRect.top - 60;
  arc.style.cssText = `left:${bRect.left+bRect.width/2}px;top:${bRect.top}px;--tx:${tRect.left-bRect.left+tRect.width/2}px;--ty:${tRect.top-bRect.top+tRect.height/2}px;--mx:${mx}px;--my:${my}px;--d:.75s;`;
  document.body.appendChild(arc);

  setTimeout(() => {
    arc.remove();
    // React the animal
    const animalId = target.replace('Zone','');
    reactAnimal(animalId, food.emoji);
    // Update food count
    if(food.count>0){
      const countEl = btn.querySelector('.food-count');
      if(countEl) countEl.textContent = food.count;
    } else {
      btn.classList.add('used');
    }
    // Hunger restore
    const a = ANIMALS[animalId] || Object.values(ANIMALS)[0];
    a.hunger = Math.min(100, a.hunger + 25);
    updateHungerBars();
    updateHappiness(18);
    hideThoughts();
    savePond();
    checkCompletion();
  }, 780);

  CN.FX.haptic('tap'); CN.Audio.play('collect');
}

/* ── ANIMAL REACTIONS ── */
function reactAnimal(id, foodEmoji){
  const emoji = document.getElementById(id+'Emoji');
  if(!emoji) return;

  CN.Audio.play(ANIMALS[id]?.happySound || 'collect');
  CN.FX.haptic('success');

  if(window.gsap){
    gsap.timeline()
      .to(emoji, {scale:1.4, rotation:-10, duration:.12, ease:'power2.out'})
      .to(emoji, {scale:1.2, rotation:10,  duration:.1})
      .to(emoji, {scale:1.3, rotation:-8,  duration:.1})
      .to(emoji, {scale:1.1, rotation:5,   duration:.1})
      .to(emoji, {scale:1,   rotation:0,   duration:.2, ease:'back.out(2)'});
  }

  // Spawn hearts
  const rect = emoji.getBoundingClientRect();
  spawnFloaters(['❤️','😋','✨','🎉'], rect.left+rect.width/2, rect.top);

  if(id==='ellie') CN.Room.greet(`Ellie loves ${foodEmoji}! 🐘💦`);
  else             CN.Room.greet(`Biscuit is SO happy! 🐶❤️`);
}

function animalTap(id, e){
  e.stopPropagation();
  const a = ANIMALS[id];
  const emoji = document.getElementById(id+'Emoji');
  if(window.gsap) CN.Anim.wobble(emoji);

  if(a.hunger < 30){
    showThoughts();
    CN.Room.greet(`${a.name} is hungry! Give them some food! 🍽️`);
  } else {
    CN.Room.greet(`${a.name} says hello! 🐾`);
  }

  // Elephant does trunk splash
  if(id==='ellie'){
    CN.Audio.play('splash');
    spawnFloaters(['💧','💦','🌊'], e.clientX, e.clientY, 8);
  } else {
    CN.Audio.play('tap');
    spawnFloaters(['🐾','❤️','🐶'], e.clientX, e.clientY, 5);
  }
}

/* ── THOUGHT BUBBLES (show what animal wants) ── */
function showThoughts(){
  Object.entries(ANIMALS).forEach(([id, a]) => {
    if(a.hunger < 60){
      const bubble = document.getElementById(id+'Bubble');
      if(bubble){
        bubble.style.display='block';
        bubble.textContent = a.wants[Math.floor(Math.random()*a.wants.length)];
        if(window.gsap) gsap.fromTo(bubble,{scale:0},{scale:1,duration:.4,ease:'back.out(3)'});
      }
    }
  });
}
function hideThoughts(){
  ['ellie','biscuit'].forEach(id=>{
    const b=document.getElementById(id+'Bubble');
    if(b){ b.style.display='none'; }
  });
}

/* ── POND TAP → RIPPLES ── */
function pondTap(e){
  const pond = document.getElementById('pondBody');
  const rect  = pond.getBoundingClientRect();
  const x = (e.clientX-rect.left) / rect.width * 100;
  const y = (e.clientY-rect.top)  / rect.height * 100;

  CN.Audio.play('ripple'); CN.FX.haptic('tap');

  if(window.gsap){
    // Create 3 expanding rings with GSAP
    for(let i=0;i<3;i++){
      const ring = document.createElement('div');
      ring.className='ripple-ring gsap-ripple';
      ring.style.cssText=`left:${x}%;top:${y}%;width:10px;height:10px;margin:-5px 0 0 -5px;`;
      pond.appendChild(ring);
      gsap.to(ring,{
        scale:10, opacity:0, duration:1.3,
        delay:i*.2, ease:'power2.out',
        onComplete:()=>ring.remove()
      });
    }
    // Slight pond scale pulse
    gsap.to(pond,{scale:.98,duration:.1,yoyo:true,repeat:1,ease:'power2.inOut'});
  } else {
    for(let i=0;i<3;i++){
      const r=document.createElement('div');
      r.className='ripple-ring css-ripple';
      r.style.cssText=`left:${x}%;top:${y}%;width:10px;height:10px;margin:-5px 0 0 -5px;animation-delay:${i*.2}s;`;
      pond.appendChild(r);
      setTimeout(()=>r.remove(),1500);
    }
  }

  P.pondTaps++;
  updateHappiness(2);

  if(P.pondTaps%5===0){
    spawnFloaters(['🦆','💦','🐸'], e.clientX, e.clientY, 6);
    CN.Room.greet('The ducks love the waves! 🦆💦');
  }
  savePond();
}

/* ── HUNGER TIMER — animals get hungry every 90 seconds ── */
function startHungerTimer(){
  P.hungerTimer = setInterval(()=>{
    let anyHungry = false;
    Object.values(ANIMALS).forEach(a=>{
      a.hunger = Math.max(0, a.hunger - 8);
      if(a.hunger<30) anyHungry=true;
    });
    updateHungerBars();
    if(anyHungry){ showThoughts(); CN.Room.greet('The animals are getting hungry! 🍽️'); }
    savePond();
  }, 90000);
}

/* ── UI UPDATES ── */
function updateHungerBars(){
  ['ellie','biscuit'].forEach(id=>{
    const a = ANIMALS[id];
    const bar = document.getElementById(id+'Hunger');
    if(!bar) return;
    if(window.gsap) gsap.to(bar,{width:a.hunger+'%',duration:.5,ease:'back.out(1.4)'});
    else bar.style.width=a.hunger+'%';
    bar.className='hunger-fill '+(a.hunger>60?'full':a.hunger>30?'hungry':'starving');
  });
}

function updateHappiness(delta){
  P.happiness = Math.min(100, P.happiness + delta);
  const fill  = document.getElementById('hapFill');
  const emoji = document.getElementById('hapEmoji');
  if(window.gsap) gsap.to(fill,{width:P.happiness+'%',duration:.6,ease:'back.out(1.4)'});
  else fill.style.width = P.happiness+'%';
  emoji.textContent = P.happiness<25?'😐':P.happiness<50?'🙂':P.happiness<75?'😊':'🥰';
  if(P.happiness>=75) { if(window.gsap) gsap.to(emoji,{scale:1.3,duration:.2,yoyo:true,repeat:1}); }
}

function checkCompletion(){
  const allFed = Object.values(ANIMALS).every(a=>a.hunger>=60);
  if(allFed && P.happiness>=60){
    showCelebrate('🐘🐶','Best Friends!','Both animals are happy and fed! ❤️');
  }
}

/* ── FLOATERS ── */
function spawnFloaters(emojis, cx, cy, n=emojis.length){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;left:${cx+(Math.random()*40-20)}px;top:${cy}px;font-size:${1.2+Math.random()*.6}rem;pointer-events:none;z-index:800;`;
    el.textContent=emojis[i%emojis.length];
    document.body.appendChild(el);
    if(window.gsap){
      gsap.to(el,{y:-60+(Math.random()*-40),x:(Math.random()*50-25),opacity:0,scale:.3,duration:.8+Math.random()*.4,ease:'power2.out',delay:i*.07,onComplete:()=>el.remove()});
    } else {
      el.style.animation='noteRise .9s ease-out forwards';
      setTimeout(()=>el.remove(),1000);
    }
  }
}

/* ── CELEBRATE ── */
function showCelebrate(emoji,title,msg){
  document.getElementById('celEmoji').textContent=emoji;
  document.getElementById('celTitle').textContent=title;
  document.getElementById('celMsg').textContent=msg;
  document.getElementById('celebrate').classList.add('show');
  if(window.gsap) CN.Anim.celebrateIn(document.querySelector('.celebrate-card'));
  CN.Audio.play('celebrate');
  (window.gsap?CN.Anim.confettiBurst(window.innerWidth/2,window.innerHeight*.3,30):CN.FX.confetti(30));
  setTimeout(hideCelebrate, 4200);
}
function hideCelebrate(){
  const ov=document.getElementById('celebrate');
  const cd=document.querySelector('.celebrate-card');
  if(window.gsap&&cd){ CN.Anim.celebrateOut(cd,ov); } else { ov.classList.remove('show'); }
}

/* ── SAVE ── */
async function savePond(){
  await CN.Room.save(ROOM_ID,{
    happiness:     P.happiness,
    ellieHunger:   ANIMALS.ellie.hunger,
    biscuitHunger: ANIMALS.biscuit.hunger,
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  try{ if(localStorage.getItem('cn_muted')==='1') document.getElementById('audioBtn').textContent='🔇'; }catch(e){}
});
</script>

<div id="johnnyHide" class="johnny-hide" style="right:3%;bottom:35%" onclick="findJohnny()" title="Who's hiding?">
  <span class="johnny-peek">👀</span>
</div>
<div id="johnnyPop" class="johnny-pop" style="display:none">
  <span class="johnny-emoji">👦</span>
  <div class="johnny-shout">Found me! 😄 (behind a big tree)</div>
</div>

<script>
/* ══ HIDDEN JOHNNY ══ */
let _johnnyFound = false;
(function initJohnny(){
  // Fade in after 8s so player has time to explore first
  setTimeout(()=>{
    const el=document.getElementById('johnnyHide');
    if(el && !_johnnyFound) el.style.opacity='1';
  }, 8000);
})();

function findJohnny(){
  if(_johnnyFound) return;
  _johnnyFound = true;
  const hide=document.getElementById('johnnyHide');
  const pop =document.getElementById('johnnyPop');
  if(!hide||!pop) return;

  hide.style.opacity='0';
  hide.style.pointerEvents='none';

  // Position pop where hide was
  const rect=hide.getBoundingClientRect();
  pop.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top-40}px;z-index:800;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;`;
  pop.style.display='flex';

  CN.Audio.play('celebrate'); CN.FX.haptic('success');
  CN.Coins.add(5,'found_johnny'); renderToyboxBar();
  CN.Room.greet("You found Johnny! 👦 +5 🪙 Golden coins!");

  // Burst stars from his position
  CN.FX.stars(rect.left+rect.width/2, rect.top, 12, ['⭐','🌟','💫','✨','🎉','👦']);

  if(window.gsap){
    gsap.timeline()
      .from(pop.querySelector('.johnny-emoji'),{scale:0,rotation:-20,duration:.5,ease:'back.out(3)'})
      .from(pop.querySelector('.johnny-shout'),{y:10,opacity:0,duration:.3},'-=.2')
      .to(pop,{y:-30,opacity:0,duration:.6,delay:2,ease:'power2.in',onComplete:()=>pop.style.display='none'});
  } else {
    setTimeout(()=>pop.style.display='none', 2500);
  }
}

</script>
